<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Pulse tier badge (placeholder art). Bolt glyph on Koda's own
       brand gradient (violet -> mint, same pair used for the app's "K"
       mark in Settings > About), since Pulse is the flagship tier. -->
  <defs>
    <linearGradient id="pulseBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B68EE"/>
      <stop offset="100%" stop-color="#5BEAD4"/>
    </linearGradient>
  </defs>
  <circle cx="12" cy="12" r="11" fill="url(#pulseBadgeGrad)" stroke="#3E3593" stroke-width="0.75"/>
  <polygon points="13.2,4.2 7.2,13 10.6,13 9.6,19.8 16.8,10 13.2,10" fill="#FFFFFF"/>
</svg>
