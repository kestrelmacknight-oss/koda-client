<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Spark avatar frame (placeholder art). A ring sized to sit just
       outside a circular avatar image, plus three small flame-colored
       accent dots. See lib/shared/widgets.dart's KodaAvatar for how the
       avatar and frame are layered. -->
  <defs>
    <linearGradient id="sparkFrameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA13D"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>
  </defs>
  <circle cx="24" cy="24" r="22.5" fill="none" stroke="url(#sparkFrameGrad)" stroke-width="3"/>
  <circle cx="24" cy="3" r="2.4" fill="#FF6B35"/>
  <circle cx="43.5" cy="30" r="1.8" fill="#FFA13D"/>
  <circle cx="6" cy="32" r="1.6" fill="#FFA13D"/>
</svg>
