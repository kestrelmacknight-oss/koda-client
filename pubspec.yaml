name: koda
description: Koda — privacy-first community platform for gamers and creators.
publish_to: 'none'
version: 0.34.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3
  url_launcher: ^6.2.6
  livekit_client: ^2.8.1
  flutter_webrtc: ^1.6.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  file_picker: ^8.1.2
  phoenix_socket: ^0.8.0
  local_notifier: ^0.1.6
  audio_session: ^0.1.21
  # Plays the in-memory WAV clip device_test_screen.dart's delayed
  # self-listen feature buffers via AudioFrameCapture -- audio_session
  # above only configures the OS audio category, nothing else in this
  # app actually plays raw/local audio.
  just_audio: ^0.9.40
  desktop_multi_window: ^0.3.1
  window_manager: ^0.4.3
  cryptography: ^2.9.0
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.0.10+1
  # Mobile OS push (Android + iOS, iOS via FCM's own APNs bridge) --
  # Android/iOS only, see lib/core/push_notifications.dart. No Windows/
  # Linux implementation exists or is needed: local_notifier already
  # covers desktop tray notifications over the live socket connection
  # those platforms keep open (see home_screen.dart's _showTrayNotification).
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # Invite/join deep links (koda:// custom scheme + koda.fyi Universal/App
  # Links) -- Android + iOS only, see lib/core/deep_links.dart. Desktop
  # would need OS-level protocol registration at install time (registry
  # entries on Windows), which is an installer concern, not a code one --
  # deliberately out of scope here.
  app_links: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# Windows mic EQ (see lib/features/settings/voice_video_settings_screen.dart
# and third_party/flutter_webrtc/windows/audio_eq_processor.cc) needs a
# real pre-encode audio processing hook that upstream flutter_webrtc
# never wires up -- this points at a locally vendored, patched copy
# instead of the pub.dev release. See tool/vendor_flutter_webrtc.ps1 to
# reproduce third_party/flutter_webrtc (gitignored, not committed) and
# native/flutter_webrtc_eq_patch/ for exactly what's patched relative to
# upstream 1.6.0.
dependency_overrides:
  flutter_webrtc:
    path: third_party/flutter_webrtc

flutter:
  uses-material-design: true
  assets:
    - assets/badges/
    - assets/frames/

# Regenerate with: dart run flutter_launcher_icons
# Source is the same brand mark already shipping in the macOS/Windows
# builds (macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_1024.png),
# pre-flattened onto an opaque #09090F background rather than left
# transparent -- iOS requires a fully opaque App Store icon (no alpha
# channel at all), and naive alpha-removal by the icon generator itself
# produced visible artifacts around the glow/smoke effect, so this was
# composited properly ahead of time instead.
flutter_launcher_icons:
  image_path: "assets/app_icon_source.png"
  android: true
  ios: true
  # Not using an adaptive-icon foreground/background split -- the source
  # mark already has its own baked-in glow/background, and Android's
  # adaptive mask crops a separate foreground layer to its center ~66%,
  # which would clip this design. A standard (non-adaptive) icon renders
  # it correctly on every launcher.




