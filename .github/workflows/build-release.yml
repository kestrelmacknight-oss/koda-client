name: Build & Release Koda

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.41.9'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  version:
    name: Get Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: version
    # firebase_cpp_sdk's bundled Windows CMake config declares an old
    # cmake_minimum_required that recent CMake (as shipped on
    # windows-latest) refuses to even parse -- this is the one platform
    # that extracts and builds that SDK's native CMake project directly,
    # so it's the only job that needs the workaround.
    env:
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # pubspec.yaml overrides flutter_webrtc to a local path (real mic
      # EQ/boost needs a native hook upstream never wires up -- see
      # native/flutter_webrtc_eq_patch/) -- that path is gitignored, so
      # `pub get` has nothing to resolve against without this first.
      # Needed on every platform's pub get, not just Windows's, even
      # though the EQ/boost code itself only activates here.
      - name: Vendor patched flutter_webrtc
        shell: pwsh
        run: ./tool/vendor_flutter_webrtc.ps1
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows release
        run: flutter build windows
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Create installer output dir
        run: New-Item -ItemType Directory -Path installer -Force
      - name: Build installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion="${{ needs.version.outputs.version }}" koda_installer.iss
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: KodaSetup-Windows-${{ needs.version.outputs.version }}
          path: installer/KodaSetup-*.exe
          retention-days: 30

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # See build-windows's identical step -- pubspec.yaml's path
      # override needs this on every platform's pub get.
      - name: Vendor patched flutter_webrtc
        shell: pwsh
        run: ./tool/vendor_flutter_webrtc.ps1
      - name: Install dependencies
        run: flutter pub get
      - name: Build macOS release
        run: flutter build macos
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Create DMG
        run: |
          export PATH="/usr/local/bin:/opt/homebrew/bin:$PATH"
          mkdir -p installer
          create-dmg \
            --volname "Koda" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "koda.app" 175 190 \
            --hide-extension "koda.app" \
            --app-drop-link 425 190 \
            "installer/Koda-${{ needs.version.outputs.version }}.dmg" \
            "build/macos/Build/Products/Release/koda.app" || true
          if [ ! -f "installer/Koda-${{ needs.version.outputs.version }}.dmg" ]; then
            cd build/macos/Build/Products/Release
            zip -r "$GITHUB_WORKSPACE/installer/Koda-${{ needs.version.outputs.version }}-macos.zip" koda.app
          fi
      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: Koda-macOS-${{ needs.version.outputs.version }}
          path: installer/Koda-*
          retention-days: 30

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libglib2.0-dev libpango1.0-dev libatk1.0-dev \
            libgdk-pixbuf2.0-dev libsoup2.4-dev \
            libjavascriptcoregtk-4.1-dev \
            libwebkit2gtk-4.1-dev \
            libsecret-1-dev \
            libnotify-dev \
            libpulse-dev
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # See build-windows's identical step -- pubspec.yaml's path
      # override needs this on every platform's pub get.
      - name: Vendor patched flutter_webrtc
        shell: pwsh
        run: ./tool/vendor_flutter_webrtc.ps1
      - name: Install dependencies
        run: flutter pub get
      - name: Build Linux release
        run: flutter build linux
      - name: Package as tar.gz
        run: |
          mkdir -p installer
          cd build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/installer/Koda-${{ needs.version.outputs.version }}-linux-x64.tar.gz" .
      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: Koda-Linux-${{ needs.version.outputs.version }}
          path: installer/Koda-*.tar.gz
          retention-days: 30

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: version
    # `secrets` isn't a valid context inside `if:` at all (GitHub Actions
    # only exposes it to `env:`/`with:`) -- bridging it through a job-level
    # env var is the documented way to conditionally run a step on
    # whether a secret is set.
    env:
      HAS_ANDROID_SECRETS: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PUSH_SECRETS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # See build-windows's identical step -- pubspec.yaml's path
      # override needs this on every platform's pub get.
      - name: Vendor patched flutter_webrtc
        shell: pwsh
        run: ./tool/vendor_flutter_webrtc.ps1
      - name: Install dependencies
        run: flutter pub get
      # Only present once GOOGLE_SERVICES_JSON_BASE64 is set (see
      # PUSH_NOTIFICATIONS.md) -- without it the Google Services Gradle
      # plugin is skipped entirely (see android/app/build.gradle.kts) and
      # this build just ships without mobile push, same as any local
      # build before Firebase is set up.
      - name: Decode Firebase config (google-services.json)
        if: ${{ env.HAS_PUSH_SECRETS == 'true' }}
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json
      # Only present once the four ANDROID_* secrets are set (see
      # android/KEYSTORE.md) -- without them this step is skipped and the
      # build below falls back to debug signing (fine for CI/testing,
      # not accepted by Google Play).
      - name: Decode release keystore
        if: ${{ env.HAS_ANDROID_SECRETS == 'true' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release.jks
          EOF
      - name: Build APK
        run: flutter build apk --release
      - name: Build App Bundle
        run: flutter build appbundle --release
      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: Koda-Android-${{ needs.version.outputs.version }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: version
    # See build-android's identical comment -- `secrets` isn't valid
    # inside `if:`, so it's bridged through this job-level env var.
    env:
      HAS_IOS_SECRETS: ${{ secrets.IOS_DIST_CERT_BASE64 != '' }}
      HAS_PUSH_SECRETS: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # See build-windows's identical step -- pubspec.yaml's path
      # override needs this on every platform's pub get.
      - name: Vendor patched flutter_webrtc
        shell: pwsh
        run: ./tool/vendor_flutter_webrtc.ps1
      - name: Install dependencies
        run: flutter pub get
      # Only present once GOOGLE_SERVICE_INFO_PLIST_BASE64 is set (see
      # PUSH_NOTIFICATIONS.md) -- without it the app just builds without
      # a Firebase config bundled in, same as any local build before
      # Firebase is set up (push registration fails closed at runtime,
      # see lib/core/push_notifications.dart).
      - name: Decode Firebase config (GoogleService-Info.plist)
        if: ${{ env.HAS_PUSH_SECRETS == 'true' }}
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 -d > ios/Runner/GoogleService-Info.plist
      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
      # Always runs, needs no secrets -- a real build-correctness check
      # (Info.plist errors, plugin incompatibilities) even before any
      # Apple Developer account is involved. Not installable anywhere.
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign
      - name: Upload unsigned iOS build
        uses: actions/upload-artifact@v4
        with:
          name: Koda-iOS-unsigned-${{ needs.version.outputs.version }}
          path: build/ios/iphoneos/Runner.app
          retention-days: 30

      # Everything below only runs once the five IOS_* secrets are set
      # (see ios/SIGNING.md) -- produces an actual signed, submittable
      # .ipa. Untested against a real Apple account as of writing; the
      # first run after adding the secrets is the real test.
      - name: Import signing certificate & provisioning profile
        if: ${{ env.HAS_IOS_SECRETS == 'true' }}
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          echo "$IOS_DIST_CERT_BASE64" | base64 -d -o "$RUNNER_TEMP/dist_cert.p12"
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 -d -o "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/dist_cert.p12" -k build.keychain -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s build.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          PROFILE_UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID xml1 -o - - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Generate ExportOptions.plist
        if: ${{ env.HAS_IOS_SECRETS == 'true' }}
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.IOS_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.gryphonheart.koda</key>
              <string>${PROFILE_UUID}</string>
            </dict>
          </dict>
          </plist>
          EOF
      - name: Build & archive signed IPA
        if: ${{ env.HAS_IOS_SECRETS == 'true' }}
        env:
          # ios/Runner.xcodeproj sets CODE_SIGN_STYLE=Manual for Release
          # but deliberately leaves these two account-specific values
          # unset -- xcodebuild picks up env vars matching a build
          # setting's name as an override, so this is how they reach it
          # without ever being committed to the project file.
          DEVELOPMENT_TEAM: ${{ secrets.IOS_TEAM_ID }}
          PROVISIONING_PROFILE_SPECIFIER: ${{ env.PROFILE_UUID }}
        run: |
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
      - name: Upload signed IPA
        if: ${{ env.HAS_IOS_SECRETS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Koda-iOS-${{ needs.version.outputs.version }}
          path: build/ios/ipa/*.ipa
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [version, build-windows, build-macos, build-linux, build-android, build-ios]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Koda v${{ needs.version.outputs.version }}
          body: |
            ## Koda v${{ needs.version.outputs.version }}

            ### Downloads
            - **Windows**: Download `KodaSetup-${{ needs.version.outputs.version }}.exe` and run the installer
            - **macOS**: Download the `.dmg` and drag Koda to Applications
            - **Linux**: Download the `.tar.gz`, extract, and run `./koda`
            - **Android**: Download the `.apk` to sideload directly, or grab the `.aab` for Play Console (see android/KEYSTORE.md for release signing setup)
            - **iOS**: Not attached here -- TestFlight/App Store builds go through App Store Connect once ios/SIGNING.md's signing secrets are set up

            ### What's New
            See [CHANGELOG.md](https://github.com/kestrelmacknight-oss/koda-client/blob/main/CHANGELOG.md) for details.
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.dmg
            release-artifacts/**/*.zip
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.apk
            release-artifacts/**/*.aab
          draft: false
          prerelease: true
          generate_release_notes: true
