name: Build & Release Koda

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.0'

jobs:
  version:
    name: Get Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows release
        run: flutter build windows --release
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Create installer output dir
        run: New-Item -ItemType Directory -Path installer -Force
      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" koda_installer.iss
        shell: powershell
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: KodaSetup-Windows-${{ needs.version.outputs.version }}
          path: installer/KodaSetup-*.exe
          retention-days: 30

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build macOS release
        run: flutter build macos --release
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Create DMG
        run: |
          mkdir -p installer
          create-dmg \
            --volname "Koda" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "koda.app" 175 190 \
            --hide-extension "koda.app" \
            --app-drop-link 425 190 \
            "installer/Koda-${{ needs.version.outputs.version }}.dmg" \
            "build/macos/Build/Products/Release/koda.app" || true
          if [ ! -f "installer/Koda-${{ needs.version.outputs.version }}.dmg" ]; then
            cd build/macos/Build/Products/Release
            zip -r "$GITHUB_WORKSPACE/installer/Koda-${{ needs.version.outputs.version }}-macos.zip" koda.app
          fi
      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: Koda-macOS-${{ needs.version.outputs.version }}
          path: installer/Koda-*
          retention-days: 30

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libglib2.0-dev libpango1.0-dev libatk1.0-dev \
            libgdk-pixbuf2.0-dev libsoup2.4-dev \
            libjavascriptcoregtk-4.0-dev libwebkit2gtk-4.0-dev
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Linux release
        run: flutter build linux --release
      - name: Package as tar.gz
        run: |
          mkdir -p installer
          cd build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/installer/Koda-${{ needs.version.outputs.version }}-linux-x64.tar.gz" .
      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: Koda-Linux-${{ needs.version.outputs.version }}
          path: installer/Koda-*.tar.gz
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [version, build-windows, build-macos, build-linux]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Koda v${{ needs.version.outputs.version }}
          body: |
            ## Koda v${{ needs.version.outputs.version }}

            ### Downloads
            - **Windows**: Download `KodaSetup-${{ needs.version.outputs.version }}.exe` and run the installer
            - **macOS**: Download the `.dmg` and drag Koda to Applications
            - **Linux**: Download the `.tar.gz`, extract, and run `./koda`

            ### What's New
            See [CHANGELOG.md](https://github.com/kestrelmacknight-oss/koda-client/blob/main/CHANGELOG.md) for details.
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.dmg
            release-artifacts/**/*.zip
            release-artifacts/**/*.tar.gz
          draft: false
          prerelease: true
          generate_release_notes: true
